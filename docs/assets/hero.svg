<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Ownference Tabs</title><desc id="desc">A calm local workspace for turning selected page text into answers.</desc><rect width="1200" height="400" rx="28" fill="#214f3e"/><circle cx="1040" cy="25" r="210" fill="#315e49"/><circle cx="1160" cy="380" r="180" fill="#294d3c"/><text x="70" y="82" fill="#daf078" font-family="Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="3">OWNFERENCE TABS / LOCAL BY DESIGN</text><text x="70" y="178" fill="#fff" font-family="Georgia,serif" font-size="58">Your reading,</text><text x="70" y="246" fill="#daf078" font-family="Georgia,serif" font-size="58" font-style="italic">with room to think.</text><text x="72" y="310" fill="#d0ded1" font-family="Arial,sans-serif" font-size="21">Turn selected page text into answers, locally.</text><rect x="815" y="80" width="260" height="240" rx="20" fill="#f7f9f2"/><rect x="839" y="107" width="74" height="12" rx="6" fill="#8cae88"/><rect x="839" y="145" width="197" height="10" rx="5" fill="#d5e0d1"/><rect x="839" y="166" width="174" height="10" rx="5" fill="#d5e0d1"/><rect x="839" y="207" width="210" height="76" rx="12" fill="#e8f1dc"/><path d="M944 219c2 15 7 20 21 25-14 5-19 10-21 25-3-15-8-20-21-25 13-5 18-10 21-25Z" fill="#537c58"/></svg>
